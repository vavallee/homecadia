# NO LONGER REQUIRED as of matter-server v0.8.0. Kept for older deployments and
# as a fallback. On 1.4.0, Home Assistant's own bleak/BlueZ proxy commissions
# fine (verified 2026-08-24, 18.8s) -- leave HA's Matter integration enabled and
# ignore this file.
#
# Temporary BLE proxy host for Matter commissioning.
#
# matter-server drives BLE commissioning through a proxy client on a machine with
# a Bluetooth adapter. On builds before v0.8.0, Home Assistant's own proxy could
# not complete the BTP handshake (matter-js/matterjs-server#1006).
#
# NOTE: the original diagnosis in this file was WRONG and is corrected here.
# The cause was not the ATT MTU. ProxyBleChannel.openChannel awaited the
# write_and_subscribe command BEFORE registering the binary-frame observer; on
# BlueZ the command response only returns after CCCD is enabled, and the device
# indicates the moment it is, so the handshake response arrived with no listener
# attached and was dropped. Fixed in matter-js/matterjs-server#710.
#
# The MTU is a real but SEPARATE defect, and not a blocker: bleak reports 23, so
# BTP fragments cap at 20 bytes instead of 244. Throughput only.
#
# The Node/noble client worked because its ordering differs. This pod runs it on
# the node holding the Bluetooth adapter. noble coexists with BlueZ here -- HA
# does not lose Bluetooth.
#
# The upstream reference client needs two fixes before it can commission at all
# (matter-js/matterjs-server#1005); apply them to the installed dist after npm
# install until that PR lands:
#   npm install @matter-server/ble-proxy@0.7.1 @stoprocent/noble ws
#   node node_modules/@matter-server/ble-proxy/dist/esm/example/noble-ble-proxy.js \
#        --server ws://<matter-server>:5580/ble
#
# The server accepts ONE proxy client. Disable HA's Matter integration first or it
# holds the slot. Commissioning also needs the device in Thread range of the border
# router, not just BLE range of this node.
apiVersion: v1
kind: Pod
metadata:
  name: noble-ble-proxy
  namespace: default
  labels:
    app: noble-ble-proxy
    temporary: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: k8sn1-master
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  containers:
  - name: proxy
    image: node:22-bookworm
    command: ["sleep", "infinity"]
    securityContext:
      capabilities:
        add: ["NET_RAW", "NET_ADMIN"]
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
