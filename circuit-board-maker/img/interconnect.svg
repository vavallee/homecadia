<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="sensor-01 Option 0 interconnect"><style>
  .bg{fill:#fbfbf9}.brd{fill:#dfe9e3;stroke:#2f5d4f;stroke-width:2}
  .cu{fill:#c8dcd2;stroke:#4a7c68;stroke-width:1}
  .pt{fill:#fff;stroke:#38403d;stroke-width:1.2}
  .hot{fill:#f6dcc8;stroke:#b4632a;stroke-width:1.2}
  .cool{fill:#d3e0ef;stroke:#3f6ea6;stroke-width:1.2}
  .hole{fill:#fbfbf9;stroke:#2f5d4f;stroke-width:1.5}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#222826}
  .lbl{font-size:11px}.sm{font-size:9px;fill:#5c6663}.hd{font-size:15px;font-weight:700}
  .cap{font-size:10px;fill:#5c6663}
  .wire{stroke:#4a7c68;stroke-width:1.6;fill:none}
  .wired{stroke:#b4632a;stroke-width:1.6;fill:none;stroke-dasharray:5 3}
  .box{fill:#fff;stroke:#38403d;stroke-width:1.5;rx:4}
  .boxa{fill:#eef4f1;stroke:#2f5d4f;stroke-width:2;rx:4}
</style><rect class="bg" width="1000" height="470"/><text class="t hd" x="500.0" y="30" text-anchor="middle">sensor-01 &#8212; Option 0 interconnect</text><text class="t cap" x="500.0" y="50" text-anchor="middle">hb-01 replaces the perfboard and flying components. The XIAO and the Seeed driver board stay.</text><rect class="boxa" x="40" y="90" width="170" height="56"/><text class="t lbl" x="125.0" y="112" text-anchor="middle">LiPo LP103454</text><text class="t sm" x="125.0" y="128" text-anchor="middle">2000 mAh &#183; 56&#215;34.5&#215;10.6</text><rect class="boxa" x="40" y="190" width="170" height="56"/><text class="t lbl" x="125.0" y="212" text-anchor="middle">panel USB-C</text><text class="t sm" x="125.0" y="228" text-anchor="middle">&#9888; CC not exposed</text><rect class="boxa" x="300" y="130" width="190" height="108"/><text class="t lbl" x="395.0" y="152" text-anchor="middle">hb-01</text><text class="t sm" x="395.0" y="168" text-anchor="middle">divider &#183; CC 5.1k &#183; ESD</text><text class="t sm" x="395.0" y="181" text-anchor="middle">encoder &#183; LED &#183; JSTs</text><rect class="box" x="580" y="60" width="190" height="60"/><text class="t lbl" x="675.0" y="82" text-anchor="middle">XIAO ESP32-C6</text><text class="t sm" x="675.0" y="98" text-anchor="middle">MCU &#183; charger &#183; radio</text><rect class="box" x="580" y="150" width="190" height="60"/><text class="t lbl" x="675.0" y="172" text-anchor="middle">Seeed driver bd</text><text class="t sm" x="675.0" y="188" text-anchor="middle">SSD1680 booster &#183; FPC</text><rect class="box" x="830" y="150" width="130" height="60"/><text class="t lbl" x="895.0" y="172" text-anchor="middle">2.9&quot; e-paper</text><text class="t sm" x="895.0" y="188" text-anchor="middle">296&#215;128 SSD1680</text><rect class="boxa" x="300" y="300" width="190" height="56"/><text class="t lbl" x="395.0" y="322" text-anchor="middle">sb-01</text><text class="t sm" x="395.0" y="338" text-anchor="middle">SHT40 satellite</text><rect class="box" x="40" y="300" width="170" height="56"/><text class="t lbl" x="125.0" y="322" text-anchor="middle">EC11 + LED</text><text class="t sm" x="125.0" y="338" text-anchor="middle">on hb-01</text><path class="wire" d="M210 118 L300 160"/><rect x="221.0" y="130.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="255.0" y="141.0" text-anchor="middle">VBAT</text><path class="wire" d="M210 218 L300 200"/><rect x="221.0" y="200.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="255.0" y="211.0" text-anchor="middle">VBUS</text><path class="wire" d="M490 160 L580 100"/><rect x="501.0" y="121.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="535.0" y="132.0" text-anchor="middle">5V / GPIO</text><path class="wire" d="M490 200 L580 185"/><rect x="501.0" y="183.5" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="535.0" y="194.5" text-anchor="middle">GPIO</text><path class="wire" d="M770 185 L830 185"/><rect x="766.0" y="176.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="800.0" y="187.0" text-anchor="middle">24p FPC</text><path class="wired" d="M395 238 L395 300"/><rect x="361.0" y="260.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="395.0" y="271.0" text-anchor="middle">I2C 4-wire</text><path class="wire" d="M675 120 L675 150"/><rect x="641.0" y="126.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="675.0" y="137.0" text-anchor="middle">2&#215;7 socket</text><path class="wire" d="M210 328 L300 250"/><rect x="221.0" y="280.0" width="68" height="15" fill="#fbfbf9" rx="2"/><text class="t sm" x="255.0" y="291.0" text-anchor="middle">GPIO</text><text class="t cap" x="500.0" y="400" text-anchor="middle">Dashed = the one link that must stay a cable: the SHT40 has to sit in the airflow path,</text><text class="t cap" x="500.0" y="416" text-anchor="middle">away from MCU heat. Putting it on hb-01 would defeat the sensor.</text><text class="t cap" x="500.0" y="444" text-anchor="middle">&#9888; The panel pigtail&#8217;s CC pins are inside the moulding &#8212; C-to-C charging needs hb-01&#8217;s receptacle</text><text class="t cap" x="500.0" y="458" text-anchor="middle">or a different pigtail. It cannot be fixed with two resistors.</text></svg>