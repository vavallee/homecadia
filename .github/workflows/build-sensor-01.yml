name: build-sensor-01

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-sensor-01.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-sensor-01.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- version.cmake derives PROJECT_VER and the Matter
      # SoftwareVersion from `git describe`. A shallow checkout has no tags,
      # which would silently build 0.0.0-untagged / SoftwareVersion 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The esp-matter image unpacks to more than the runner's free space
      # (~14GB); a job-level `container:` pulls before any step can clean up,
      # so the build runs via `docker run` instead. Same image as
      # docs/build.md — keep the two pinned together when upgrading.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build (esp32c6, shipping profile)
        run: |
          docker run --rm -v "$PWD":/work \
            espressif/esp-matter:release-v1.6_idf_v5.5.5 \
            bash -c 'cd /work/firmware/sensor-01 && idf.py set-target esp32c6 build'

      # sdkconfig.bench turns light sleep off so the USB console survives. It is
      # a genuinely different configuration -- anything behind #if CONFIG_PM_ENABLE
      # compiles in one profile and not the other -- and it is the profile used
      # for hands-on bring-up, so a break here blocks bench work while the
      # shipping build stays green. Same container, already pulled.
      - name: Build (esp32c6, bench profile)
        run: |
          docker run --rm -v "$PWD":/work \
            espressif/esp-matter:release-v1.6_idf_v5.5.5 \
            bash -c 'cd /work/firmware/sensor-01 && \
              idf.py -B build-bench -DSDKCONFIG=build-bench/sdkconfig \
                     -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench" build'

      # Confirms the two profiles actually differ on sleep -- positively on both
      # sides, so a missing or truncated sdkconfig fails instead of passing
      # vacuously. Same script runs locally: tools/check-profiles.sh
      - name: Verify profiles differ on sleep
        run: ./tools/check-profiles.sh

      # A SoftwareVersion that fails to increase makes OTA decline the update
      # with no error -- the device just never updates. Catch it here instead.
      # Same script runs locally: tools/check-version.sh
      - name: Check version is derived, carried and monotonic
        run: ./tools/check-version.sh

      - name: Collect flash images
        run: |
          mkdir -p out
          cp firmware/sensor-01/build/*.bin out/
          cp firmware/sensor-01/build/bootloader/bootloader.bin out/
          cp firmware/sensor-01/build/partition_table/partition-table.bin out/
          cp firmware/sensor-01/build/flasher_args.json out/

      - uses: actions/upload-artifact@v4
        with:
          name: sensor-01-esp32c6
          path: out/
